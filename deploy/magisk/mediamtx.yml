logLevel: info
logDestinations: [stdout]

api: no
metrics: no
pprof: no
playback: no

rtsp: yes
protocols: [tcp]
encryption: "no"
rtspAddress: :8554

rtmp: no
hls: yes
hlsAddress: :8888
hlsEncryption: no
hlsAllowOrigin: '*'
hlsAlwaysRemux: no
# 普通 fMP4 HLS 更适合经过极空间一类多层 HTTP 代理；代价是比 WebRTC 多数秒延迟。
hlsVariant: fmp4
hlsSegmentCount: 4
hlsSegmentDuration: 1s
# 关闭网页后及时释放 HLS reader；连续播放的分段请求会保持 muxer 活跃。
hlsMuxerCloseAfter: 15s
srt: no

webrtc: yes
webrtcAddress: :8889
webrtcEncryption: no
webrtcAllowOrigin: '*'
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: ''
webrtcIPsFromInterfaces: yes

pathDefaults:
  record: no

paths:
  cam:
    # MediaMTX v1.9.0：无 publisher 时先通知 app 唤醒，再等待首帧。
    runOnDemand: /data/local/tmp/bin/stream_demand.sh
    runOnDemandRestart: yes
    runOnDemandStartTimeout: 15s
    runOnDemandCloseAfter: 10s
    runOnRead: /data/local/tmp/bin/hook_on.sh
    runOnUnread: /data/local/tmp/bin/hook_off.sh
