name: Android build

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  assemble:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
